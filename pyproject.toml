[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Local Gmail MCP server over stdio"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
